version: '3.8'

services:
  word-imposter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: word-imposter-game
    ports:
      - "6969:6969"
    environment:
      - PORT=6969
      - NODE_ENV=production
    volumes:
      - rooms-data:/app/data
    restart: unless-stopped

volumes:
  rooms-data:
